name: Deploy hsdesign-blog to Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'guides/**'
      - '_config.yml'
      - 'sitemap.xml'
      - 'robots.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: hugo --minify

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler pages deploy ./public --project-name hsdesign-blog --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
