baseURL: "https://blog.hsdesign.biz/"
title: "HS Design 室内设计博客"
languageCode: "zh-my"
defaultContentLanguage: "zh"
hasCJKLanguage: true
theme: "PaperMod"

enableRobotsTXT: true
enableGitInfo: false

# SEO
pagination:
  pagerSize: 10

taxonomies:
  category: categories
  tag: tags

params:
  env: production
  title: "HS Design 室内设计博客"
  description: "马来西亚柔佛室内设计、新山装修指南、家居装修知识分享 — HS Design 健康空间设计"
  keywords: [室内设计, 柔佛, 新山, 装修, 马来西亚, 家居设计, 健康空间]
  author: "HS Design"
  images: ["/images/og-image.png"]
  DateFormat: "2006-01-02"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  ShowToc: true
  TocOpen: false
  comments: false
  hideFooter: false
  ShowLastMod: true

  homeInfoParams:
    Title: "HS Design 室内设计博客"
    Content: >
      马来西亚柔佛一站式室内设计服务 | 健康空间设计理念
      💡 装修知识 · 设计灵感 · 家居好物推荐

  socialIcons:
    - name: whatsapp
      title: "联系我们"
      url: "https://wa.me/60123456789"
    - name: website
      title: "HS Design 官网"
      url: "https://hsdesign.biz"

  # Affiliate settings
  affiliate:
    shopee_tracking_id: "hsdesign"
    lazada_tracking_id: "hsdesign"

  # Schema markup
  schema:
    type: ProfessionalService
    name: "HS Design 健康空间室内设计"
    url: "https://hsdesign.biz"
    areaServed: ["Johor", "Johor Bahru", "Singapore"]
    priceRange: "RM 500 - RM 50,000"

menu:
  main:
    - identifier: categories
      name: 分类
      url: /categories/
      weight: 10
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 20
    - identifier: about
      name: 关于我们
      url: https://hsdesign.biz
      weight: 30
    - identifier: contact
      name: 询价
      url: https://wa.me/60123456789
      weight: 40

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['$$', '$$']]
          inline: [['$', '$']]

outputs:
  home:
    - HTML
    - RSS
    - JSON

privacy:
  googleAnalytics:
    anonymizeIP: true
    disable: false
    respectDoNotTrack: true
    useSessionStorage: false

services:
  googleAnalytics:
    ID: G-377QYBK6C8
